<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Conflict Ledger</title>

    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #212529; margin: 0; padding: 20px; overflow: hidden; }

        /* 3) Dynamic Full-Size Background Image Layer with Fade Effects */
        #bgImageLayer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: -2; opacity: 0; transition: opacity 0.8s ease-in-out; pointer-events: none;
        }
        #bgOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* background: rgba(244, 246, 249, 0.85); */
            z-index: -1;
            pointer-events: none;
        }

        .layout-grid { display: flex; flex-direction: column; gap: 20px; max-width: 1600px; margin: 0 auto; height: calc(100vh - 40px); }

        /* Top Row: Interactive Timeline Track */
        .timeline-wrapper { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 15px; min-height: 250px; }
        #timelineContainer { border: 1px solid #e3e6f0; border-radius: 6px; overflow: hidden; background: white; }

        /* 1) Vis.js Items Setup & Configuration to Stack Horizontally under Scale Axis */
        .vis-item { background-color: #eaecf4; border-color: #dddfeb; font-size: 12px; font-weight: 500; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
        .vis-item.vis-selected { background-color: #4e73df !important; border-color: #4e73df !important; color: white !important; }

        /* 2) FIXED: Text Clipping Overrides force text to stay visible when timeline blocks shrink */
        .vis-item .vis-item-content {
            overflow: visible !important;
            white-space: nowrap !important;
        }
        .vis-item.vis-range, .vis-item.vis-point {
            overflow: visible !important;
        }

        /* Bottom Grid Section: Left Column Detail Card vs Right Column List */
        .bottom-split { display: grid; grid-template-columns: 1fr 400px; gap: 20px; flex-grow: 1; min-height: 0; }

        /* 6) FIXED: Center-Mounted Deep Detail Description Rect Panel */
        .inspector-panel {
            background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
            position: relative; overflow-y: auto;
        }
        .inspector-content-box { max-width: 650px; width: 100%; margin: 0 auto; }

        /* Language Direction Bi-directional overrides for Center Panel */
        .inspector-content-box[dir="ltr"] { text-align: left; }
        .inspector-content-box[dir="rtl"] { text-align: right; }

        /* Right Column List Panel Container */
        .list-sidebar {
            /* background: white; */
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header { padding: 15px; background: #f8f9fc; border-bottom: 1px solid #e3e6f0; }
        .search-box { width: 100%; padding: 10px; border: 1px solid #d1d3e2; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .list-scroll-area {
            padding: 15px 0;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Compact List Card Layout Components */
        .event-list-card {
            background: rgba(248,249,252,0.3); /*#f8f9fc;*/
            /* border-left: 4px solid #4e73df; */
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            /*
            border: 1px solid #e3e6f0;
            border-left-width: 4px;
            */
        }
        .event-list-card:hover {
            background: #f1f3f9;
            transform: translateX(2px);
        }
        .event-list-card .date {
            background: rgba(248,249,252,1); /*#f8f9fc;*/
            font-weight: bold;
            font-size: 11px;
            color: #4e73df;
        }
        .event-list-card h4 {
            background: rgba(248,249,252,1); /*#f8f9fc;*/
            margin: 2px 0 0 0;
            font-size: 14px;
            color: #2e59d9;
        }

        .wiki-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-decoration: none; color: #495057; background: #e9ecef; border: 1px solid #dee2e6; margin-right: 8px; margin-top: 12px; }
        .wiki-badge:hover { background: #adb5bd; color: white; }

    /**
     * Vis.js Mapping Core Engine
     */
    function renderTimelineCanvasView(eventsToRender) {
        const container = document.getElementById('timelineContainer');
        if (timelineInstance) { timelineInstance.destroy(); timelineInstance = null; }
        container.innerHTML = '';

        // Map events with dynamic on-the-fly runtime padding variables
        const items = eventsToRender.map(e => {
            const rawStart = String(e.start).trim();
            const rawEnd = e.end ? String(e.end).trim() : "";

            // Dynamic on-the-fly calendar calculations
            let visStart = rawStart;
            if (rawStart.length === 4) {
                visStart = `${rawStart}-01-01`; // Dynamic runtime injection
            }

            let visEnd = null;
            if (rawEnd) {
                visEnd = rawEnd.length === 4 ? `${rawEnd}-12-31` : rawEnd;
            }

            return {
                id: e.id,
                content: e.title,
                start: visStart,  // ◄ Passed exclusively to the Vis.js tracking lane pixels
                end: visEnd,      // ◄ Passed exclusively to the Vis.js tracking lane pixels
                type: e.end ? 'range' : 'point'
            };
        });

        const options = {
            stack: true,
            margin: { item: 10, axis: 10 },
            showCurrentTime: false,
            zoomable: false,
            orientation: { axis: 'top', item: 'bottom' },
            start: '1917-01-01', end: '1960-01-01'
        };

        timelineInstance = new vis.Timeline(container, items, options);

        timelineInstance.on('select', (props) => {
            if (props.items.length > 0) displayDeepDetailsView(props.items[0]);
        });
    }


    /**
     * Right Pillar: Renders the explicit text list layout
     */
    function renderSidebarList(events) {
        const container = document.getElementById('listScrollArea');
        container.innerHTML = '';

        events.forEach(e => {
            const card = document.createElement('div');
            const compactDateLabel = e.display_date_text ? e.display_date_text : e.start.substring(0, 4);

            card.className = 'event-list-card';
            card.innerHTML = `
                <span class="date">${compactDateLabel}</span>
                <h4>${e.title}</h4>
            `;
            /*
            card.innerHTML = `

                <h4>${e.title}</h4>
            `;

                <p>${e.description || 'No description summary available.'}</p>
            `;
            */

            // CLICK TO SCROLL INTERACTION FUNCTION
            card.onclick = () => {
                displayDeepDetailsView(e.id);
                if (timelineInstance) {
                    timelineInstance.setSelection(e.id, { focus: true });
                    timelineInstance.moveTo(e.start); // Scrolls the canvas item into center view instantly
                }
            };
            container.appendChild(card);
        });
    }

    function filterSidebarList() {
        const query = document.getElementById('sidebarSearch').value.toLowerCase();
        const filtered = globalEventsRegistry.filter(e =>
            e.title.toLowerCase().includes(query) // ||
            //(e.description && e.description.toLowerCase().includes(query))
        );
        renderSidebarList(filtered);
    }

    function displayDeepDetailsView(eventId) {
        const matched = globalEventsRegistry.find(e => e.id === eventId);
        if (!matched) return;

        const contentBox = document.getElementById('inspectorContent');
        const containsRtlText = /[\u0600-\u06FF\u0590-\u05FF]/.test(matched.title);
        contentBox.setAttribute('dir', containsRtlText ? 'rtl' : 'ltr');

        // Clean, direct string assignments with zero risk of padding leakage
        const timeframeDisplay = matched.end ? `${matched.start} to ${matched.end}` : matched.start;

        document.getElementById('drawerTitle').innerHTML = `
            ${matched.title} <br>
            <span style="font-size:13px; color:#858796; font-weight:normal;">📅 Bounded Period: ${timeframeDisplay}</span>
        `;
        document.getElementById('drawerDesc').textContent = matched.description || 'No descriptive summary processed.';

        const linksBox = document.getElementById('drawerLinks');
        linksBox.innerHTML = '';
        matched.source.forEach(src => {
            const url = `https://${src.lang}.wikipedia.org/wiki/${src.slug}`;
            const a = document.createElement('a');
            a.href = url; a.target = '_blank'; a.className = 'wiki-badge';
            a.innerHTML = `<strong>${src.lang.toUpperCase()} Record</strong> (${(src.strlength/1000).toFixed(0)}k chars) ↗`;
            linksBox.appendChild(a);
        });

        // Background Image Animation transitions
        const bgLayer = document.getElementById('bgImageLayer');
        if (matched.bg_image_url) {
            bgLayer.style.opacity = '0';
            setTimeout(() => {
                bgLayer.style.backgroundImage = `url('${matched.bg_image_url}')`;
                bgLayer.style.opacity = '1';
            }, 200);
        } else {
            bgLayer.style.opacity = '0';
        }
    }
