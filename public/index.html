    /**
     * Vis.js Mapping Core Engine
     */
    function renderTimelineCanvasView(eventsToRender) {
        const container = document.getElementById('timelineContainer');
        if (timelineInstance) { timelineInstance.destroy(); timelineInstance = null; }
        container.innerHTML = '';

        // Map events with dynamic on-the-fly runtime padding variables
        const items = eventsToRender.map(e => {
            const rawStart = String(e.start).trim();
            const rawEnd = e.end ? String(e.end).trim() : "";

            // Dynamic on-the-fly calendar calculations
            let visStart = rawStart;
            if (rawStart.length === 4) {
                visStart = `${rawStart}-01-01`; // Dynamic runtime injection
            }

            let visEnd = null;
            if (rawEnd) {
                visEnd = rawEnd.length === 4 ? `${rawEnd}-12-31` : rawEnd;
            }

            return {
                id: e.id,
                content: e.title,
                start: visStart,  // ◄ Passed exclusively to the Vis.js tracking lane pixels
                end: visEnd,      // ◄ Passed exclusively to the Vis.js tracking lane pixels
                type: e.end ? 'range' : 'point'
            };
        });

        const options = {
            stack: true,
            margin: { item: 10, axis: 10 },
            showCurrentTime: false,
            zoomable: false,
            orientation: { axis: 'top', item: 'bottom' },
            start: '1917-01-01', end: '1960-01-01'
        };

        timelineInstance = new vis.Timeline(container, items, options);

        timelineInstance.on('select', (props) => {
            if (props.items.length > 0) displayDeepDetailsView(props.items[0]);
        });
    }


    /**
     * Right Pillar: Renders the explicit text list layout
     */
    function renderSidebarList(events) {
        const container = document.getElementById('listScrollArea');
        container.innerHTML = '';

        events.forEach(e => {
            const card = document.createElement('div');
            const compactDateLabel = e.display_date_text ? e.display_date_text : e.start.substring(0, 4);

            card.className = 'event-list-card';
            card.innerHTML = `
                <span class="date">${compactDateLabel}</span>
                <h4>${e.title}</h4>
            `;
            /*
            card.innerHTML = `

            `;
            */

            // CLICK TO SCROLL INTERACTION FUNCTION
            card.onclick = () => {
                displayDeepDetailsView(e.id);
                if (timelineInstance) {
                    timelineInstance.setSelection(e.id, { focus: true });
                    timelineInstance.moveTo(e.start); // Scrolls the canvas item into center view instantly
                }
            };
            container.appendChild(card);
        });
    }

    /*** Global Language Switching Controller*/
    function changeGlobalInterfaceLanguage(langCode) {
        selectedActiveLanguageCode = langCode;
        // Update button visual states dynamically
        document.querySelectorAll('.lang-switch-btn').forEach(
            btn => btn.classList.remove('active-lang')
        );
        event.target.classList.add('active-lang');
        // Refresh detail card pane instantly using the newly targeted language parameters mapping
        if (activeSelectedEventId) {
            displayDeepDetailsView(activeSelectedEventId);
        }
    }

    function filterSidebarList() {
        const query = document.getElementById('sidebarSearch').value.toLowerCase();
        const filtered = globalEventsRegistry.filter(e =>
            e.title.toLowerCase().includes(query) // ||
            //(e.description && e.description.toLowerCase().includes(query))
        );
        renderSidebarList(filtered);
    }

    function displayDeepDetailsView(eventId) {
        const matched = globalEventsRegistry.find(e => e.id === eventId);
        if (!matched) return;

        const contentBox = document.getElementById('inspectorContent');
        const containsRtlText = /[\u0600-\u06FF\u0590-\u05FF]/.test(matched.title);
        contentBox.setAttribute('dir', containsRtlText ? 'rtl' : 'ltr');

        // Clean, direct string assignments with zero risk of padding leakage
        const timeframeDisplay = matched.end ? `${matched.start} to ${matched.end}` : matched.start;

        document.getElementById('drawerTitle').innerHTML = `
            ${matched.title} <br>
            <span style="font-size:13px; color:#858796; font-weight:normal;">📅 Bounded Period: ${timeframeDisplay}</span>
        `;
        document.getElementById('drawerDesc').textContent = matched.description || 'No descriptive summary processed.';

        const linksBox = document.getElementById('drawerLinks');
        linksBox.innerHTML = '';
        matched.source.forEach(src => {
            const url = `https://${src.lang}.wikipedia.org/wiki/${src.slug}`;
            const a = document.createElement('a');
            a.href = url; a.target = '_blank'; a.className = 'wiki-badge';
            a.innerHTML = `<strong>${src.lang.toUpperCase()} Record</strong> (${(src.strlength/1000).toFixed(0)}k chars) ↗`;
            linksBox.appendChild(a);
        });

        // Background Image Animation transitions
        const bgLayer = document.getElementById('bgImageLayer');
        if (matched.bg_image_url) {
            bgLayer.style.opacity = '0';
            setTimeout(() => {
                bgLayer.style.backgroundImage = `url('${matched.bg_image_url}')`;
                bgLayer.style.opacity = '1';
            }, 200);
        } else {
            bgLayer.style.opacity = '0';
        }
    }
